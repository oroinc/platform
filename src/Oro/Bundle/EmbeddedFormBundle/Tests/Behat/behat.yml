oro_behat_extension:
    suites:
        OroEmbeddedFormBundle:
            contexts:
                - Oro\Bundle\TestFrameworkBundle\Tests\Behat\Context\OroMainContext
                - Oro\Bundle\UserBundle\Tests\Behat\Context\FeatureContext
                - Oro\Bundle\DataGridBundle\Tests\Behat\Context\GridContext
                - Oro\Bundle\FormBundle\Tests\Behat\Context\FormContext
                - Oro\Bundle\UIBundle\Tests\Behat\Context\ContextSelectorContext
                - Oro\Bundle\NavigationBundle\Tests\Behat\Context\FeatureContext
                - Oro\Bundle\LocaleBundle\Tests\Behat\Context\LocalizationContext
            paths:
                - '@OroEmbeddedFormBundle/Tests/Behat/Features'

    elements:
        Embedded Form CSS:
            selector:
                locator: '//div[contains(@class, "control-group")][label[contains(@class, "control-label")][normalize-space(text())="CSS"]]//bdo'
                type: xpath

        Embedded Form Success Message:
            selector:
                locator: '//div[contains(@class, "attribute-item")][label[contains(@class, "attribute-item__term")][normalize-space(text())="Success message"]]//div[contains(@class, "control-label")]'
                type: xpath
