api:
    entity_aliases:
        # The base entity is used by legacy EV_* resources and is not a standalone API resource.
        Oro\Bundle\EntityExtendBundle\Entity\EnumOption:
            alias: enumoptionentity
            plural_alias: enumoptionentities
        Oro\Bundle\ApiBundle\Model\EnumOption:
            alias: enumoption
            plural_alias: enumoptions
        Oro\Bundle\ApiBundle\Model\EntityIdentifier:
            alias:        entityidentifier
            plural_alias: entityidentifiers
        Oro\Bundle\ApiBundle\Batch\Model\BatchError:
            alias:        asyncoperationerror
            plural_alias: asyncoperationerrors

    entities:
        Oro\Bundle\ApiBundle\Model\EntityIdentifier:
            identifier_field_names: [id]
            fields:
                # this is a predefined field name that is used to provide
                # the class name of the target entity
                # @see \Oro\Component\EntitySerializer\ConfigUtil::CLASS_NAME
                # @see \Oro\Bundle\ApiBundle\Request\DocumentBuilder\ObjectAccessorInterface::getClassName
                __class__:
                    meta_property: true
                    data_type: string
                # the identifier of the target entity
                id:
                    data_type: string
            # this entity does not have own API resource
            actions: false

        Oro\Bundle\EntityExtendBundle\Entity\EnumOption:
            documentation_resource: '@OroApiBundle/Resources/doc/api/enum_option.md'
            fields:
                internalId:
                    exclude: true
                enumCode:
                    exclude: true
            filters:
                fields:
                    id:
                        allow_array: true
                    priority: ~
            sorters:
                fields:
                    priority: ~
            # this entity does not have own API resource
            # it is defined in the config to be able to use enum options in API
            actions: false

        Oro\Bundle\ApiBundle\Model\EnumOption:
            documentation_resource: '@OroApiBundle/Resources/doc/api/enum_option.md'
            disable_inclusion: false
            upsert: false
            fields:
                enumCode:
                    exclude: false
                    form_options:
                        mapped: false
                optionId:
                    exclude: false
                    property_path: internalId
                    form_options:
                        mapped: false
                name:
                    exclude: true
                names:
                    target_class: Oro\Bundle\TranslationBundle\Entity\TranslationKey
                    target_type: collection
                    property_path: _
                    depends_on: [ id ]
                    form_options:
                        mapped: false
            filters:
                fields:
                    id:
                        data_type: string
                        allow_array: true
                    enumCode:
                        data_type: string
                        allow_array: true
                    optionId:
                        data_type: string
                        exclude: false
                        property_path: internalId
                        allow_array: true
                    priority:
                        data_type: integer
                    default:
                        data_type: boolean
            sorters:
                fields:
                    optionId: ~
                    priority: ~
            actions:
                get_list:
                    exclude: false
                    acl_resource: oro_entityconfig_manage
                get:
                    exclude: false
                    acl_resource: oro_entityconfig_manage
                create:
                    exclude: false
                    acl_resource: oro_entityconfig_manage
                update:
                    exclude: false
                    acl_resource: oro_entityconfig_manage
                delete:
                    exclude: false
                    acl_resource: oro_entityconfig_manage
                delete_list: false
                update_list: false
            subresources:
                names:
                    exclude: true

        Oro\Bundle\ApiBundle\Entity\AsyncOperation:
            documentation_resource: '@OroApiBundle/Resources/doc/api/async_operation.md'
            disable_meta_properties: true
            fields:
                entityType:
                    data_type: entityType
                    property_path: entityClass
                summary:
                    depends_on: [ status ]
                hasErrors:
                    exclude: true
                jobId:
                    exclude: true
                dataFileName:
                    exclude: true
                actionName:
                    exclude: true
                affectedEntities:
                    exclude: true
            actions:
                get:
                    description: Get asynchronous operation
                get_list: false
                create: false
                update: false
                delete: false
                delete_list: false
            subresources:
                owner:
                    actions:
                        get_relationship: false
                        get_subresource: false
                organization:
                    actions:
                        get_relationship: false
                        get_subresource: false
                errors:
                    target_class: Oro\Bundle\ApiBundle\Batch\Model\BatchError
                    target_type: collection
                    actions:
                        get_subresource:
                            description: Get errors occurred when processing an asynchronous operation
                            disable_fieldset: true
                            disable_inclusion: true
                            disable_sorting: true

        Oro\Bundle\ApiBundle\Batch\Model\BatchError:
            documentation_resource: '@OroApiBundle/Resources/doc/api/async_operation.md'
            disable_meta_properties: true
            identifier_field_names: [id]
            fields:
                id:
                    data_type: string
                status:
                    data_type: string
                    property_path: statusCode
                title:
                    data_type: string
                detail:
                    data_type: string
                source:
                    data_type: object
            # this entity is accessible only via "errors" sub-resource of the asynchronous operation resource
            actions: false
