<% if (editable) { %>
<label <% if (description) {%> title="<%- description %>"<% } %>
    class="checkbox-label role-capability__item-label<% if (isAccessLevelChanged) {%> role-capability__item-label_changed<% } %>"
    ><input type="checkbox" value="<%- selected_access_level %>"
        <% if (access_level === selected_access_level) { %> checked<% } %>><%- label %><%
    if (isAccessLevelChanged) {
        %><span class="sr-only"><%- _.__('oro.role.access_level_changed') %></span><%
    }
%></label>
<% } else { %>
<div<% if (description) {%> title="<%- description %>"<% } %> class="role-capability__item-label<% if (noAccess) { %> role-capability__item-label--no-access<% } %>"><%- label %></div>
<% } %>
