include:
  - '@OroUserBundle:user.yml'

Oro\Bundle\UserBundle\Entity\User:
  victor:
    firstName: Victor
    lastName: Target
    username: victor
    organization: '@organization'
    organizations: ['@organization']
    userRoles: ['@userRole']
    owner: '@business_unit'
    businessUnits: ['@business_unit']
    email: victor@example.com
    password: '<userPassword(@victor->username, @victor->salt)>'
    confirmationToken: 'behatstoredvalue'

Oro\Bundle\EmailBundle\Entity\EmailTemplate:
  substitutable_attribute:
    organization: '@organization'
    owner: '@admin'
    is_system: 0
    name: 'substitutable_attribute'
    entity_name: 'Oro\\Bundle\\UserBundle\\Entity\\User'
    type: 'txt'
    subject: 'Substitutable attribute template'
    content: "Value start {{ confirmationToken|default('N_A') }} value end"
