<% if (title && title.trim()) { %>
    <% if (navbar) { %>
        <h1 class="grid-view-title" <% if (obj.uniqueId) { %> id="<%- uniqueId %>"<% } %>><%- title %></h1>
    <% } else { %>
        <h3 class="grid-view-title" <% if (obj.uniqueId) { %> id="<%- uniqueId %>"<% } %>><%- title %></h3>
    <% } %>
<% } %>
<% if (hasCaret && title && title.trim()) { %>
    <span class="grid-view-icon" aria-hidden="true"></span>
<% } %>
